worker_processes 1;
error_log staging/local-auth/error.log error;
pid staging/local-auth/nginx.pid;

events {
    worker_connections 128;
}

http {
    access_log off;
    server_tokens off;
    client_header_timeout 10s;
    client_body_timeout 10s;
    client_max_body_size 2k;
    client_body_temp_path staging/local-auth/client_body;
    proxy_temp_path staging/local-auth/proxy;
    fastcgi_temp_path staging/local-auth/fastcgi;
    uwsgi_temp_path staging/local-auth/uwsgi;
    scgi_temp_path staging/local-auth/scgi;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    proxy_hide_header Cache-Control;
    proxy_hide_header X-Content-Type-Options;

    types {
        text/html html;
        text/css css;
        text/javascript js;
        audio/ogg ogg;
        image/png png;
        image/svg+xml svg;
        image/x-icon ico;
    }

    server {
        listen 127.0.0.1:8081 default_server;
        server_name _;
        return 400;
    }

    server {
        listen 127.0.0.1:8081;
        server_name 127.0.0.1 localhost;
        absolute_redirect off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;

        location = / {
            return 303 /battle-city/;
        }

        location ~ ^/(login|logout)$ {
            proxy_pass http://127.0.0.1:8788;
        }

        location = /_game_auth {
            internal;
            proxy_pass http://127.0.0.1:8788/check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Game-URI $request_uri;
        }

        location = /battle-city {
            return 303 /battle-city/;
        }

        location ^~ /battle-city/ {
            auth_request /_game_auth;
            error_page 401 = @sign_in;
            alias dist/;
            index index.html;
        }

        location @sign_in {
            return 303 /login;
        }

        location / {
            return 404;
        }
    }
}
